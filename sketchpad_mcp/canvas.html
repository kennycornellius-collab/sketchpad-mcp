<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sketchpad-mcp</title>
  <link rel="stylesheet" href="canvas.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.min.css">
</head>
<body>

  <div id="hint-bar"></div>
  <div id="mount"></div>
  <div id="action-bar">
    <button id="close-btn">Close tab</button>
    <span id="status"></span>
    <button id="send-btn">Send to Claude</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
          onerror="console.error('FAILED to load React')"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"
          onerror="console.error('FAILED to load ReactDOM')"></script>
  <script src="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"
          onerror="console.error('FAILED to load ExcalidrawLib')"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const cancelUrl = '/cancel?token=' + encodeURIComponent(token);
    const hint = params.get('hint');
    const hintBar = document.getElementById('hint-bar');
    if (hint) {
      hintBar.textContent = hint;
    } else {
      hintBar.style.display = 'none';
    }

    let excalidrawAPI = null;

    ReactDOM.createRoot(document.getElementById('mount')).render(
      React.createElement(ExcalidrawLib.Excalidraw, {
        excalidrawAPI: (api) => { excalidrawAPI = api; }
      })
    );

    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Exporting…';

      try {
        const blob = await ExcalidrawLib.exportToBlob({
          elements: excalidrawAPI.getSceneElements(),
          appState: { ...excalidrawAPI.getAppState(), exportBackground: true },
          files: excalidrawAPI.getFiles(),
          mimeType: 'image/png',
        });

        const buffer = await blob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        const base64 = btoa(binary);

        status.textContent = 'Sending…';

        const res = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Canvas-Token': token },
          body: JSON.stringify({ image: base64 }),
        });

        if (!res.ok) throw new Error(`Server returned ${res.status}`);

        status.textContent = 'Sent! Waiting for Claude to ask for another sketch…';
        btn.disabled = true;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        btn.disabled = false;
      }
    });

    let lastCallId = null;

    async function pollState() {
      try {
        const res = await fetch('/state', { headers: { 'X-Canvas-Token': token } });
        if (!res.ok) return;
        const data = await res.json();
        if (data.call_id && data.call_id !== lastCallId) {
          lastCallId = data.call_id;
          if (data.hint) {
            hintBar.textContent = data.hint;
            hintBar.style.display = '';
          } else {
            hintBar.style.display = 'none';
          }
          btn.disabled = false;
          status.textContent = '';
        }
      } catch (_) {}
    }

    setInterval(pollState, 1000);

    document.getElementById('close-btn').addEventListener('click', () => {
      navigator.sendBeacon(cancelUrl);
      window.close();
    });

    // Closing the tab via the browser X (or navigating away) also cancels any
    // pending call so the agent doesn't wait out the full timeout.
    window.addEventListener('pagehide', () => navigator.sendBeacon(cancelUrl));
  </script>

</body>
</html>
