<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>canvas-mcp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; }
    #mount { flex: 1; }
  </style>
</head>
<body>

  <div id="mount"></div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.min.css">

  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
          onerror="console.error('FAILED to load React')"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"
          onerror="console.error('FAILED to load ReactDOM')"></script>
  <script src="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"
          onerror="console.error('FAILED to load ExcalidrawLib')"></script>

  <script>
    console.log('React:',         typeof React         !== 'undefined' ? React.version : 'MISSING');
    console.log('ReactDOM:',      typeof ReactDOM      !== 'undefined' ? 'ok'          : 'MISSING');
    console.log('ExcalidrawLib:', typeof ExcalidrawLib !== 'undefined' ? 'ok'          : 'MISSING');

    if (typeof ExcalidrawLib === 'undefined') {
      document.getElementById('mount').textContent = 'ExcalidrawLib failed to load — check console';
    } else {
      let excalidrawAPI = null;

      try {
        ReactDOM.createRoot(document.getElementById('mount')).render(
          React.createElement(ExcalidrawLib.Excalidraw, {
            excalidrawAPI: (api) => {
              excalidrawAPI = api;
              console.log('Excalidraw API ready');
            }
          })
        );
        console.log('render() called');
      } catch (e) {
        console.error('render failed:', e);
        document.getElementById('mount').textContent = 'render failed — check console';
      }
    }
  </script>

</body>
</html>
