<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>canvas-mcp concept</title>
  <link rel="stylesheet" href="concept.css">
</head>
<body>

  <div id="drop-zone">
    <p>Drop an image here</p>
    <p>or click to browse</p>
    <p>or paste with Ctrl+V / Cmd+V</p>
  </div>

  <p id="hint">Supports PNG, JPEG, GIF, WebP</p>

  <input type="file" id="file-input" accept="image/*">

  <script>
    const zone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    function showImage(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const url = URL.createObjectURL(file);
      zone.innerHTML = '';
      const img = document.createElement('img');
      img.src = url;
      zone.appendChild(img);
    }

    // Click to browse
    zone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => showImage(fileInput.files[0]));

    // Drag and drop
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      showImage(e.dataTransfer.files[0]);
    });

    // Paste
    document.addEventListener('paste', e => {
      const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
      if (item) showImage(item.getAsFile());
    });
  </script>

</body>
</html>
