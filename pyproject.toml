[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "0.1.0"
description = "MCP server that opens a drawing canvas in the browser and returns the sketch as an image"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
canvas-mcp = "server:main"
